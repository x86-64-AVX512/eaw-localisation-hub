name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows build and tests
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout with native dependencies
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y

      - name: Install exact dependencies
        run: npm ci

      - name: Install pinned Zig toolchain
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/bootstrap-zig.ps1

      - name: Audit public repository contents
        run: npm run check:publication

      - name: Test and build all artifacts
        run: npm run check
