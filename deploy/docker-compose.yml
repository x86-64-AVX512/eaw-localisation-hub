name: eaw-localisation-hub

services:
  server:
    build:
      context: ..
      dockerfile: Dockerfile
    image: eaw-localisation-hub:0.8.7F1
    restart: unless-stopped
    init: true
    environment:
      EAW_HUB_GITHUB_REPOSITORY: ${EAW_HUB_GITHUB_REPOSITORY:-EaW-Team/equestria_dev}
      EAW_HUB_CANONICAL_REPOSITORY: ${EAW_HUB_CANONICAL_REPOSITORY:-EaW-Team/equestria_dev}
    ports:
      - "${HUB_BIND_ADDRESS:-127.0.0.1}:${HUB_PORT:-3210}:3210"
    volumes:
      - hub-data:/data
      - ./backups:/backups
    mem_limit: 384m
    cpus: 0.75
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  caddy:
    image: caddy:2.10-alpine
    profiles: ["tls"]
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    environment:
      HUB_DOMAIN: ${HUB_DOMAIN:?Set HUB_DOMAIN in deploy/.env}
      HUB_HTTPS_PORT: ${HUB_HTTPS_PORT:-443}
    ports:
      - "${HUB_HTTP_PORT:-80}:80"
      - "${HUB_HTTPS_PORT:-443}:443"
      - "${HUB_HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 64
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  hub-data:
  caddy-data:
  caddy-config:
